<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول - SarVita</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: #222; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .login-box { background:#1e1e1f; padding:24px; border-radius:8px; width:100%; max-width:380px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
    .login-box h1 { font-size:20px; margin:0 0 12px; text-align:center }
    .login-box label { display:block; margin-top:8px; font-size:13px; color:#ddd; }
    .login-box input { width:100%; padding:10px; margin-top:6px; border-radius:6px; border:1px solid #333; background:#111; color:#fff; box-sizing:border-box }
    .login-box button { width:100%; margin-top:12px; padding:10px; border-radius:6px; border:0; background:#3b82f6; color:#fff; font-weight:600; cursor:pointer }
    .msg { margin-top:8px; font-size:13px; color:#f88; min-height:18px; text-align:center }
    @media (max-width:420px){ .login-box{ padding:16px; border-radius:6px } }
  </style>
</head>
<body>
  <div class="login-box" role="main">
    <h1>تسجيل الدخول</h1>
    <div>
      <label for="handle">اسم الحساب</label>
      <input id="handle" name="handle" autocomplete="username" />
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
      <button id="loginBtn">دخول</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    async function postJson(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        credentials: 'include'
      });
      const text = await res.text();
      try { return { status: res.status, body: text ? JSON.parse(text) : null }; }
      catch (e) { return { status: res.status, body: text }; }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const handle = document.getElementById('handle').value.trim();
      const password = document.getElementById('password').value || '';
      const msgEl = document.getElementById('msg');
      msgEl.textContent = '';

      if (!handle) { msgEl.textContent = 'أدخل اسم الحساب'; return; }

      try {
        const result = await postJson('/api/users/login', { handle, password });
        if (result.status === 200) {
          // نجاح - إعادة التوجيه إلى الصفحة الرئيسية
          window.location.href = '/';
        } else if (result.body && result.body.error) {
          msgEl.textContent = result.body.error;
        } else {
          msgEl.textContent = 'فشل تسجيل الدخول';
        }
      } catch (err) {
        msgEl.textContent = 'خطأ في الاتصال بالخادم';
      }
    });

    // Submit on Enter
    [document.getElementById('handle'), document.getElementById('password')].forEach(el => {
      el.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
      });
    });
  </script>
</body>
</html>
